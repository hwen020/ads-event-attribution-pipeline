name: Compose fault drill and benchmark
on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run all six throughput and latency trials
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build application image
        run: |
          mvn -B -ntp -DskipTests package
          docker build --build-arg JAR_SOURCE=prebuilt -t ads-attribution:local .
      - name: Start isolated Compose stack
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "REPLAY_TOKEN=$token" >> "$GITHUB_ENV"
          REPLAY_TOKEN="$token" docker compose up --no-build --wait --wait-timeout 240
      - name: Fault and recovery checks
        run: python3 scripts/faults.py
      - name: Verify live Prometheus data and Grafana provisioning
        run: |
          dashboard="$(curl -fsS --retry 6 --retry-all-errors -u admin:admin http://localhost:3000/api/dashboards/uid/ads-pipeline)"
          jq -e '.dashboard.panels | length >= 10' <<< "$dashboard"
          for attempt in {1..12}; do
            if docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=ads_deduplicated_total' |
                jq -e 'any(.data.result[]; (.value[1] | tonumber) > 0)'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Measure one and three consumers
        if: inputs.run_benchmarks
        run: |
          for workers in 1 3; do
            WORKER_CONCURRENCY="$workers" docker compose up -d --no-deps --wait worker
            for count in 1000 10000 100000; do
              python3 scripts/benchmark.py "$count" --run "c${workers}-n${count}" --timeout 420
            done
          done
      - name: Upload measurements
        if: always() && inputs.run_benchmarks
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/*.json
          if-no-files-found: warn
      - name: Diagnose stack errors
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80 api worker kafka postgres
      - name: Stop Compose stack
        if: always()
        run: docker compose down
