name: Pipeline CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, unit tests, Flyway and real Kafka/PostgreSQL integration tests
        run: mvn -B -ntp verify
      - name: Static analysis
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:4.9.3.0:check
      - name: Dependency vulnerability audit
        run: docker run --rm -v "${{ github.workspace }}/target:/artifacts:ro" aquasec/trivy:0.76.2 filesystem --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /artifacts
      - name: Compose validation
        run: docker compose config --quiet
      - name: Image build
        run: docker build -t ads-attribution:ci .
